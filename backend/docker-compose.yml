services:
  postgres:
    image: postgres:16-alpine
    container_name: lis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-lis}
    ports:
      - '5432:5432'
    volumes:
      - lis_pgdata:/var/lib/postgresql/data

volumes:
  lis_pgdata:
