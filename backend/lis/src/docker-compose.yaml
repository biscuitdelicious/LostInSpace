services:
  postgres:
    image: postgres:17-alpine
    container_name: lis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: grencofe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
